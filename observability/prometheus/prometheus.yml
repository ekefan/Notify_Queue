global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: notify-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: notify-publisher
    static_configs:
      - targets: ["publisher:9101"]

  - job_name: notify-worker
    static_configs:
      - targets: ["worker-v2:9102"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
