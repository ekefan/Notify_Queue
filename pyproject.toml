[project]
name = "notify-queue"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.0.1",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "sqlalchemy[asyncio]>=2.0.52",
]


[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a Docker daemon and starts PostgreSQL",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "testcontainers[postgres]>=4.13,<5",
]
