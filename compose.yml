services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: notify_queue
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    
  api:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on:
      - postgres
  
  worker:
    build: .
    command: python -m src.worker
    depends_on:
      - postgres
# docker compose up --scale worker=3

volumes:
  pgdata: